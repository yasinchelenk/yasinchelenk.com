# Proje public_html köküne kurulduğunda: tüm istekler public/ klasörüne gider,
# app/, storage/, templates/, bin/ ve diğer dosyalara dışarıdan erişilemez.
Options -Indexes
DirectoryIndex index.php
RewriteEngine On

# SSL sertifikası doğrulaması (AutoSSL / Sectigo / Let's Encrypt) hiçbir yönlendirmeye takılmamalı
RewriteRule ^\.well-known/ - [L]

# HTTPS sertifikası çıktıktan sonra aşağıdaki iki satırın başındaki # işaretini kaldırın:
# RewriteCond %{HTTPS} !=on
# RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

# www → çıplak alan adı
RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
RewriteRule ^ %{REQUEST_SCHEME}://%1%{REQUEST_URI} [R=301,L]

RewriteCond %{REQUEST_URI} !^/public/
RewriteRule ^(.*)$ public/$1 [L]
