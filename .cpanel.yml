---
# cPanel → Git Version Control → "Deploy HEAD Commit" bu adımları çalıştırır.
# Kod ~/public_html'e kopyalanır; storage/ (veritabanı, mailler), config.local.php,
# .well-known ve cPanel'in .htaccess satırları korunur.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /usr/bin/rsync -a --delete --exclude=.git --exclude=.cpanel.yml --exclude=/storage/ --exclude=/app/config.local.php --exclude=/.well-known/ --exclude=/cgi-bin/ --exclude=/.htaccess ./ $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/storage/messages $DEPLOYPATH/storage/outbox $DEPLOYPATH/storage/uploads
    - /bin/cp storage/.htaccess $DEPLOYPATH/storage/.htaccess
    - /usr/local/bin/php bin/install-htaccess.php $DEPLOYPATH.htaccess
